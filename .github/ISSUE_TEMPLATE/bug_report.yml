name: Bug report
description: Report a viewer, DICOM import, performance, or website problem.
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: This issue is public. Do not include patient data, private DICOM files, or credentials.
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Include any error message.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Page and steps to reproduce
      description: Include the dataset and settings involved, if relevant. Can you reproduce it with a built-in sample?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment (optional)
      description: For viewer issues, include browser and OS versions, and GPU if known.
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs (optional)
      description: Remove patient information and credentials before attaching anything.
